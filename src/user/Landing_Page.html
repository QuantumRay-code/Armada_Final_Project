<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Landing Page</title>
    <link rel="stylesheet" href="/css/Landing_styles.css" />
  </head>
  <body>
    <main>
      <section id="hero-section">
        <img src="/assets/img/shape.png" alt="" id="background-shape" />

        <header>
          <div class="container">
            <div id="brand">
              <img src="/assets/img/logo.png" alt="Logo" id="brand-logo" />
              <h3 id="brand-title">Di ko Alam Title</h3>
            </div>
            <nav>
              <ul id="nav-links">
                <li><a href="#">About us</a></li>
                <li><a href="#">Products</a></li>
                <li><a href="#">Contact us</a></li>
                <li><a href="#" class="btn">Sign up</a></li>
              </ul>
            </nav>
          </div>
        </header>

        <section id="hero-content">
          <div class="container">
            <div class="hero-text">
              <h1>Start</h1>
              <h1>Shopping Now</h1>
              <p>
                Lorem ipsum dolor sit amet, consectetur adipisicing elit.
                Delectus eius distinctio odit, magni magnam qui ex perferendis
                vitae!
              </p>
              <a href="#" class="btn">Shop Now!</a>
            </div>
            <div class="hero-image">
              <img src="/assets/img/girl_shop.png" alt="Person Image" id="hero-img" />
            </div>
          </div>
        </section>
      </section>
    </main>
  </body>
</html>
