<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/css/cart.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <aside>
        <img id="logoutBtn" src="/assets/logo.svg" alt="Logo">
        <a href="/src/user/dashboard.html"><img src="/assets/dashboard_icon.svg" alt="Dashboard Icon"></a>
    </aside>
    
    <main>
        <header>
            <ul id="headerContainer" class="list-unstyled">
                <li>
                    <h6><img src="/assets/header_icon.svg" alt="Header Icon"> Let’s order fresh items for you.</h6>

                    <a id="bar_icon" data-bs-toggle="offcanvas" href="#offcanvasExample" role="button"
                        aria-controls="offcanvasExample">
                        <i class="fa-solid fa-bars"></i>
                    </a>
                </li>
                <li id="authContainer">
                    <button type="button" class="btn btn-primary" data-bs-toggle="modal"
                        data-bs-target="#signupModal">Signup</button>
                    <button type="button" class="btn btn-primary" data-bs-toggle="modal"
                        data-bs-target="#loginModal">Login</button>
                </li>
            </ul>
        </header>

        <section class="sub_main">
            <section class="search_section">
                <form>
                    <input type="text" class="form-control" name="search" placeholder="Search">
                    <button type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
                </form>
                <button class="cart_btn"><i class="fa-solid fa-cart-shopping"></i> Cart (0)</button>
            </section>

            <!-- james -->
            <section class="row g-4">
                <section class="col-md-7">
                    <section class="card mb-3">
                        <section class="card-body d-flex align-items-center gap-3">
                            <img src="image1.jpg" alt="Mixed salad dish" class="rounded" style="width: 80px; height: 80px; object-fit: cover;">
                            <section class="d-flex justify-content-between align-items-center flex-grow-1">
                                <header>
                                    <p class="text-muted mb-1">Vegetables</p>
                                    <h5 class="card-title mb-0">$10</h5>
                                </header>
                                <section class="input-group" style="width: 160px;">
                                    <button class="btn btn-outline-secondary" type="button" style="border-radius: 8px 0 0 8px;">-</button>
                                    <input type="number" class="form-control text-center" value="1" min="1" style="border-left: 0; border-right: 0;">
                                    <button class="btn btn-outline-secondary" type="button" style="border-radius: 0 8px 8px 0;">+</button>
                                </section>
                            </section>
                        </section>
                    </section>
    
                    <section class="card mb-3">
                        <section class="card-body d-flex align-items-center gap-3">
                            <img src="image2.jpg" alt="Vegetable flatbread" class="rounded" style="width: 80px; height: 80px; object-fit: cover;">
                            <section class="d-flex justify-content-between align-items-center flex-grow-1">
                                <header>
                                    <p class="text-muted mb-1">Vegetables</p>
                                    <h5 class="card-title mb-0">$10</h5>
                                </header>
                                <section class="input-group" style="width: 160px;">
                                    <button class="btn btn-outline-secondary" type="button" style="border-radius: 8px 0 0 8px;">-</button>
                                    <input type="number" class="form-control text-center" value="1" min="1" style="border-left: 0; border-right: 0;">
                                    <button class="btn btn-outline-secondary" type="button" style="border-radius: 0 8px 8px 0;">+</button>
                                </section>
                            </section>
                        </section>
                    </section>
    
    
                    <section class="card mb-3">
                        <section class="card-body d-flex align-items-center gap-3">
                            <img src="image3.jpg" alt="Fresh vegetable salad" class="rounded" style="width: 80px; height: 80px; object-fit: cover;">
                            <section class="d-flex justify-content-between align-items-center flex-grow-1">
                                <header>
                                    <p class="text-muted mb-1">Vegetables</p>
                                    <h5 class="card-title mb-0">$10</h5>
                                </header>
                                <section class="input-group" style="width: 160px;">
                                    <button class="btn btn-outline-secondary" type="button" style="border-radius: 8px 0 0 8px;">-</button>
                                    <input type="number" class="form-control text-center" value="1" min="1" style="border-left: 0; border-right: 0;">
                                    <button class="btn btn-outline-secondary" type="button" style="border-radius: 0 8px 8px 0;">+</button>
                                </section>
                            </section>
                        </section>
                    </section>
    
    
                    <section class="card mb-3">
                        <section class="card-body d-flex align-items-center gap-3">
                            <img src="image4.jpg" alt="Vegetable burger" class="rounded" style="width: 80px; height: 80px; object-fit: cover;">
                            <section class="d-flex justify-content-between align-items-center flex-grow-1">
                                <header>
                                    <p class="text-muted mb-1">Vegetables</p>
                                    <h5 class="card-title mb-0">$10</h5>
                                </header>
                                <section class="input-group" style="width: 160px;">
                                    <button class="btn btn-outline-secondary" type="button" style="border-radius: 8px 0 0 8px;">-</button>
                                    <input type="number" class="form-control text-center" value="1" min="1" style="border-left: 0; border-right: 0;">
                                    <button class="btn btn-outline-secondary" type="button" style="border-radius: 0 8px 8px 0;">+</button>
                                </section>
                            </section>
                        </section>
                    </section>
                </section>
    
                <aside class="col-md-5">
                    <section class="card">
                        <section class="card-body">
                            <section class="mb-4">
                                <h4 class="card-title mb-3">Shipping Information</h4>
                                <section class="progress mb-4" style="height: 4px;">
                                    <section class="progress-bar" role="progressbar" style="width: 33%"></section>
                                </section>
                                <form>
                                    <section class="mb-3">
                                        <input type="text" class="form-control" placeholder="Address">
                                    </section>
                                    <section class="mb-3">
                                        <input type="text" class="form-control" placeholder="Address 2">
                                    </section>
                                    <section class="row g-3">
                                        <section class="col-5">
                                            <input type="text" class="form-control" placeholder="City">
                                        </section>
                                        <section class="col-4">
                                            <input type="text" class="form-control" placeholder="State">
                                        </section>
                                        <section class="col-3">
                                            <input type="text" class="form-control" placeholder="ZIP">
                                        </section>
                                    </section>
                                </form>
                            </section>
    
                            <section class="border-top pt-4">
                                <h4 class="card-title mb-3">Order Summary</h4>
                                <section class="d-flex justify-content-between mb-2">
                                    <span class="text-muted">Subtotal</span>
                                    <span>$40</span>
                                </section>
                                <section class="d-flex justify-content-between mb-3">
                                    <span class="text-muted">Shipping Fee</span>
                                    <span>$5</span>
                                </section>
                                <section class="d-flex justify-content-between border-top pt-3 mb-4">
                                    <strong>Total Amount</strong>
                                    <strong>$45</strong>
                                </section>
                                <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#paymentModal">
                                    Proceed to Checkout
                                </button>
                            </section>
                        </section>
                    </section>
                </aside>
            </section>

            <!-- Payment Modal -->
            <section class="modal fade" id="paymentModal" tabindex="-1" aria-labelledby="paymentModalLabel" aria-hidden="true">
                <section class="modal-dialog modal-dialog-centered">
                    <section class="modal-content p-4 rounded-4 shadow">
                        <section class="d-flex justify-content-between align-items-center">
                            <section class="d-flex align-items-center gap-2">
                                <img src="/assets/logo.svg" alt="Payment Logo" width="30">
                                <img src="/assets/Visa.png" alt="Visa" width="50">
                                <img src="/assets/mastercard.png" alt="Mastercard" width="50">
                            </section>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </section>

                        <section class="modal-body">
                            <h5 class="fw-bold">Card Details</h5>

                            <form>
                                <section class="mb-3">
                                    <label for="cardName" class="form-label">Card Name</label>
                                    <input type="text" class="form-control" id="cardName" placeholder="JHAVER GURTIZA">
                                </section>

                                <section class="mb-3">
                                    <label for="cardNumber" class="form-label">Card Number</label>
                                    <input type="text" class="form-control" id="cardNumber" placeholder="XXXX XXXX XXXX XXXX">
                                </section>

                                <section class="row g-2">
                                    <section class="col">
                                        <label for="expiration" class="form-label">Expiration</label>
                                        <input type="text" class="form-control" id="expiration" placeholder="MM/YY">
                                    </section>

                                    <section class="col">
                                        <label for="cvc" class="form-label">CVC</label>
                                        <input type="text" class="form-control" id="cvc" placeholder="XXX">
                                    </section>
                                </section>
                            </form>
                        </section>

                        <section class="modal-footer border-0 d-flex flex-column">
                            <p class="fw-bold text-primary fs-5">Total Amount: $45</p>
                            <button type="button" class="btn btn-primary w-100 py-2">Pay</button>
                        </section>
                    </section>
                </section>
            </section>

            <!-- Payment Complete Modal -->
            <section class="modal fade" id="paymentCompleteModal" tabindex="-1" aria-hidden="true">
                <section class="modal-dialog modal-dialog-centered">
                    <section class="modal-content p-4 rounded-4 shadow text-center">
                        <section class="modal-body">
                            <img src="/assets/PV assets/modal_check.png" alt="Success" width="50" class="mb-3">
                            <h5 class="fw-bold">Payment Complete</h5>
                            <p class="text-muted">Thank you for your purchase!</p>
                        </section>

                        <section class="modal-footer border-0">
                            <button type="button" class="btn btn-primary w-100" data-bs-dismiss="modal">OK</button>
                        </section>
                    </section>
                </section>
            </section>

    
            <nav class="position-fixed start-0 translate-middle-y ps-3" style="width: 80px; height: 1793px; top: -25px; border-right: 1px solid #E5EDF5;">
                <ul class="nav flex-column gap-4">
                    <li class="nav-item">
                        <a class="nav-link active" href="#">
                            <img src="/assets/logo.svg" alt="Home" style="width: 24px; height: 24px;">
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <img src="grid.svg" alt="Categories" style="width: 24px; height: 24px;">
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <img src="list.svg" alt="Orders" style="width: 24px; height: 24px;">
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <img src="settings.svg" alt="Settings" style="width: 24px; height: 24px;">
                        </a>
                    </li>
                </ul>
            </nav>
        </main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="/js/payment.js"></script>
    </body>
</html>
