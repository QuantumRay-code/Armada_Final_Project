<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/dashboard.css">
    <title>Dashboard</title>
</head>

<body>
    <aside>
        <img src="/assets/logo.svg" alt="Logo">
        <a href=""><img src="/assets/dashboard_icon.svg" alt="Dashboard Icon"></a>
    </aside>
    <main>
        <header>
            <ul class="list-unstyled">
                <li>
                    <h6><img src="/assets/header_icon.svg" alt="Header Icon"> Let’s order fresh items for you.</h6>
                   
                    <a id="bar_icon" data-bs-toggle="offcanvas" href="#offcanvasExample" role="button" aria-controls="offcanvasExample">
                        <i class="fa-solid fa-bars"></i>
                    </a>
                    <img class="logo" src="/assets/logo.svg" alt="Logo">
                </li>
                <li>
                    <button>Signup</button>
                    <button>Login</button>
                </li>
            </ul>
        </header>
        <section class="sub_main">
            <section class="search_section">
                <form>
                    <input type="text" class="form-control" name="search" placeholder="Search">
                    <button type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
                </form>
                <button class="cart_btn"><i class="fa-solid fa-cart-shopping"></i> Cart (0)</button>
            </section>
            <section class="content_section">
                <div class="categories">
                    <h6>Cateogries</h6>
                    <ul>
                        <li>
                            <a href="">
                                <img src="/assets/categories/allproducts.png" class="img-fuid" alt="All Products">
                                <p>All Products</p>
                            </a>
                        </li>
                        <li>
                            <a href="">
                                <img src="/assets/categories/fruits.png" class="img-fuid" alt="All Products">
                                <p>Fruits</p>
                            </a>
                        </li>
                        <li>
                            <a href="">
                                <img src="/assets/categories/vegetable.png" class="img-fuid" alt="All Products">
                                <p>Vegetables</p>
                            </a>
                        </li>
                        <li>
                            <a href="">
                                <img src="/assets/categories/crops.png" class="img-fuid" alt="All Products">
                                <p>Crops</p>
                            </a>
                        </li>
                        <li>
                            <a href="">
                                <img src="/assets/categories/poultry.png" class="img-fuid" alt="All Products">
                                <p>Poultry</p>
                            </a>
                        </li>
                        <li>
                            <a href="">
                                <img src="/assets/categories/livestocks.png" class="img-fuid" alt="All Products">
                                <p>livestocks</p>
                            </a>
                        </li>
                    </ul>
                </div>
                <div class="products">
                    <h6>All Products (36)</h6>
                    <ul>
                        <li>
                            <a href="">
                                <img class="product_img" src="/assets/products/crops/1.png" alt="Product 1">
                                <div class="product_wrapper">
                                    <div class="product_info">
                                        <h6>Vegetables</h6>
                                        <p>
                                            <i class="fa-solid fa-star"></i>
                                            <i class="fa-solid fa-star"></i>
                                            <i class="fa-solid fa-star"></i>
                                            <i class="fa-solid fa-star"></i>
                                            <i class="fa-solid fa-star"></i>
                                        </p>
                                        <p>36 Ratings</p>
                                    </div>
                                    <div class="product_price">
                                        <p>$10</p>
                                    </div>
                                </div>
                            </a>
                        </li>
                        <li>
                            <a href="">
                                <img class="product_img" src="/assets/products/crops/1.png" alt="Product 1">
                                <div class="product_wrapper">
                                    <div class="product_info">
                                        <h6>Vegetables</h6>
                                        <p>
                                            <i class="fa-solid fa-star"></i>
                                            <i class="fa-solid fa-star"></i>
                                            <i class="fa-solid fa-star"></i>
                                            <i class="fa-solid fa-star"></i>
                                            <i class="fa-solid fa-star"></i>
                                        </p>
                                        <p>36 Ratings</p>
                                    </div>
                                    <div class="product_price">
                                        <p>$10</p>
                                    </div>
                                </div>
                            </a>
                        </li>
                        


                    </ul>
                </div>
            </section>
        </section>
    </main>




    <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasExample" aria-labelledby="offcanvasExampleLabel" style="width: 80px;">
        <div class="offcanvas-header">
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
            <div class="col-12 d-flex justify-content-center">
                <a id="dashboard_icon" href=""><img src="/assets/dashboard_icon.svg" alt="Dashboard Icon"></a>
            </div>
        </div>
    </div>
</body>

</html>
